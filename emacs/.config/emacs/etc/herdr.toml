# Only herdr started from Emacs reads this (HERDR_CONFIG_PATH); others use ~/.config/herdr/config.toml.

onboarding = false

[theme]
name = "terminal"

[theme.custom]
panel_bg = "reset"
# Light themes set bright white to the background color, so text would vanish.
text = "reset"
subtext0 = "reset"
overlay1 = "reset"

[keys]
prefix = "ctrl+a"
new_workspace = ""
new_worktree = ""
workspace_picker = ""
goto = ""
rename_workspace = ""
close_workspace = ""
toggle_sidebar = ""
navigate_workspace_up = ""
navigate_workspace_down = ""
next_agent = "prefix+shift+j"
previous_agent = "prefix+shift+k"
focus_agent = "prefix+alt+1..9"

[ui]
prompt_new_workspace_name = true
hide_tab_bar_when_single_tab = true
show_agent_labels_on_pane_borders = true
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

[ui.toast]
delivery = "off"

[ui.sound]
enabled = true
